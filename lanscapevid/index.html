<script>
  // ================== SEMUA LINK IKLAN TETAP UTUH ==================
  const adLinksList = [
    "https://www.profitablecpmratenetwork.com/u666fja6?key=2e5b8f8db6d24f5655ac4136832b98a4",
    "https://www.profitablecpmratenetwork.com/e60uraaz?key=00a8daf307455fd2003c7555c0a41b6f",
    "https://www.profitablecpmratenetwork.com/e60uraaz?key=00a8daf307455fd2003c7555c0a41b6f"
  ];
  
  function getRandomAdLink() {
    return adLinksList[Math.floor(Math.random() * adLinksList.length)];
  }
  
  const mainAdLink = "https://www.profitablecpmratenetwork.com/u666fja6?key=2e5b8f8db6d24f5655ac4136832b98a4";
  
  // ================== DAFTAR VIDEO LANDSCAPE ==================
  const videoList = [
    { src: "https://cdn.videy.co/TcQ4f0Hc1.mp4", title: "🏝️ Pantai Pasir Putih · Landscape" },
    { src: "https://cdn.videy.co/SJADaNto1.mp4", title: "🌲 Hutan Tropis · Nuansa Damai" },
    { src: "https://cdn.videy.co/jU7UtSxX1.mp4", title: "🌊 Kebun Belakang Rumah · Tenang" },
    { src: "https://cdn.videy.co/TNyD7wL91.mp4", title: "🎬 Sunset di Tanah Lot" },
    { src: "https://cdn.videy.co/UTtjdOI01.mp4", title: "🌸 Anak SMA · Semangat Alam" },
    { src: "https://cdn.videy.co/sVBVQOOm1.mp4", title: "💖 Tante Ange · Pantai Eksotis" },
  ];
  
  function openRandomAd() {
    const randomAd = getRandomAdLink();
    window.open(randomAd, "_blank");
  }
  
  function renderVideos() {
    const grid = document.getElementById('videosGrid');
    if (!grid) return;
    grid.innerHTML = '';
    videoList.forEach((video, index) => {
      const videoId = `video_${index}`;
      const card = document.createElement('div');
      card.className = 'video-card-item';
      card.innerHTML = `
        <div class="video-portrait">
          <div class="video-container">
            <video id="${videoId}" controls playsinline poster="">
              <source src="${video.src}" type="video/mp4">
              Browser tidak mendukung video.
            </video>
          </div>
        </div>
        <div class="video-caption">
          💕 ${video.title || '🎬 Keindahan Alam'}
        </div>
        <button class="download-video-btn" data-video-index="${index}"> Download Video</button>
      `;
      grid.appendChild(card);
      
      const downloadBtn = card.querySelector('.download-video-btn');
      if (downloadBtn) {
        downloadBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openRandomAd();
        });
      }
    });
  }
  
  renderVideos();
  
  // ================== LOGIKA AGE POPUP (30 DETIK) ==================
  let activeVideo = null;
  let waitingForAgeResponse = false;
  let isVideoPausedByPopup = false;
  
  function getActivePlayingVideo() {
    for (let i = 0; i < videoList.length; i++) {
      const videoElem = document.getElementById(`video_${i}`);
      if (videoElem && !videoElem.paused && !videoElem.ended) {
        return videoElem;
      }
    }
    return null;
  }
  
  function showAgePopupForVideo(videoElem) {
    if (waitingForAgeResponse) return;
    if (document.getElementById('agePopup').style.display === 'flex') return;
    activeVideo = videoElem;
    if (activeVideo && !activeVideo.paused) {
      activeVideo.pause();
      isVideoPausedByPopup = true;
    }
    waitingForAgeResponse = true;
    document.getElementById('agePopup').style.display = 'flex';
  }
  
  function hideAgePopup() {
    document.getElementById('agePopup').style.display = 'none';
    waitingForAgeResponse = false;
    isVideoPausedByPopup = false;
  }
  
  function showInterstitialAd(callbackAfterClose) {
    let interstitialDiv = document.getElementById('adInterstitial');
    let iframeInter = document.getElementById('interstitialIframe');
    if (iframeInter) iframeInter.src = mainAdLink;
    interstitialDiv.style.display = 'flex';
    
    const openBtn = document.getElementById('openInterstitialAdBtn');
    const closeBtn = document.getElementById('closeInterstitialBtn');
    
    const cleanup = () => {
      interstitialDiv.style.display = 'none';
      if (iframeInter) iframeInter.src = 'about:blank';
      if (callbackAfterClose) callbackAfterClose();
    };
    
    const openHandler = () => {
      window.open(mainAdLink, '_blank');
      cleanup();
    };
    
    const closeHandler = () => {
      cleanup();
    };
    
    if (openBtn) {
      const newOpen = openBtn.cloneNode(true);
      openBtn.parentNode.replaceChild(newOpen, openBtn);
      newOpen.addEventListener('click', openHandler);
    }
    if (closeBtn) {
      const newClose = closeBtn.cloneNode(true);
      closeBtn.parentNode.replaceChild(newClose, closeBtn);
      newClose.addEventListener('click', closeHandler);
    }
  }
  
  function onAgeYes() {
    hideAgePopup();
    showInterstitialAd(() => {
      if (activeVideo && activeVideo.paused && !activeVideo.ended) {
        activeVideo.play().catch(e => console.log("play error"));
      }
      activeVideo = null;
      isVideoPausedByPopup = false;
    });
  }
  
  function onAgeNo() {
    hideAgePopup();
    window.open(mainAdLink, '_blank');
    if (activeVideo) activeVideo.pause();
    activeVideo = null;
  }
  
  document.getElementById('ageYesBtn').addEventListener('click', onAgeYes);
  document.getElementById('ageNoBtn').addEventListener('click', onAgeNo);
  
  function checkAllVideosForAgePopup() {
    if (waitingForAgeResponse) return;
    const playingVideo = getActivePlayingVideo();
    if (!playingVideo) return;
    const currentTime = playingVideo.currentTime;
    const videoId = playingVideo.id;
    const lastTimeKey = `lastPopup_${videoId}`;
    let lastTime = parseFloat(sessionStorage.getItem(lastTimeKey)) || 0;
    if (currentTime >= lastTime + 30) {
      sessionStorage.setItem(lastTimeKey, Math.floor(currentTime / 30) * 30);
      showAgePopupForVideo(playingVideo);
    }
  }
  
  setInterval(() => {
    checkAllVideosForAgePopup();
  }, 500);
  
  for (let i = 0; i < videoList.length; i++) {
    const videoElem = document.getElementById(`video_${i}`);
    if (videoElem) {
      videoElem.addEventListener('seeked', function() {
        const seg = Math.floor(this.currentTime / 30);
        sessionStorage.setItem(`lastPopup_${this.id}`, seg * 30);
      });
    }
  }
  
  // ================== PERIODIC & POPUP IKLAN ==================
  function closeAd() {
    document.getElementById("adPopup").style.display = "none";
  }
  
  function showPeriodicAd() {
    let popup = document.getElementById("adPopup");
    let iframe = document.getElementById("adIframe");
    if (iframe) iframe.src = mainAdLink;
    if (popup) popup.style.display = "block";
    setTimeout(() => {
      if (popup) popup.style.display = "none";
    }, 12000);
  }
  
  function randomAdLoop() {
    let delay = Math.floor(Math.random() * (40000 - 30000)) + 30000;
    setTimeout(() => {
      showPeriodicAd();
      setTimeout(randomAdLoop, 500);
    }, delay);
  }
  randomAdLoop();
  
  document.addEventListener("DOMContentLoaded", function() {
    let openLinkBtn = document.getElementById("openAdLinkBtn");
    if (openLinkBtn) {
      openLinkBtn.addEventListener("click", function(e) {
        e.preventDefault();
        window.open(mainAdLink, "_blank");
      });
    }
  });
  
  // Geo redirect
  function geoip(g) {
    setTimeout(function() {
      if (g && g.country === "ID") {
        window.open(adLinksList[1], "_blank");
      } else {
        window.open(adLinksList[2], "_blank");
      }
    }, 3000);
  }
</script>
