<title>Multi VlDlO</title>

<style>
body{margin:0;font-family:Arial;background:#f1f1f1;}
.navbar{display:flex;justify-content:space-between;padding:12px 20px;background:#fff;border-bottom:1px solid #ddd;}
.logo{font-weight:bold;}
.upload-btn{background:#111;color:#fff;padding:8px 18px;border-radius:20px;border:none;}
.container{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding:20px;}
.video-wrapper{text-align:center;}
.video-card{width:100%;height:500px;border-radius:20px;overflow:hidden;background:#000;}
video{width:100%;height:100%;object-fit:cover;}
.download-btn{margin-top:10px;background:#111;color:#fff;padding:8px 16px;border-radius:20px;border:none;}
.floating-social{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;}
.floating-social img{width:50px;height:50px;border-radius:50%;}
.age-popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;justify-content:center;align-items:center;z-index:99999;}
.age-box{background:#fff;padding:25px;border-radius:15px;text-align:center;}
.age-btn{margin:10px;padding:8px 16px;border:none;border-radius:10px;}
.yes-btn{background:green;color:#fff;}
.no-btn{background:red;color:#fff;}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">vldey.co</div>
  <button class="upload-btn">Upload</button>
</div>

<div class="container" id="videoContainer"></div>

<div id="agePopup" class="age-popup" style="display:none;">
<div class="age-box">
<h2>Konfirmasi Usia</h2>
<p>Apakah Anda sudah berusia 18+?</p>
<button class="age-btn yes-btn" onclick="confirmAge()">Ya</button>
<button class="age-btn no-btn" onclick="denyAge()">Tidak</button>
</div>
</div>

  { src:"https://cdn.videy.co/JoeFikZd1.mp4", title:"Video Terbaru" }
];

const container = document.getElementById("videoContainer");

videos.forEach((video) => {
  const wrapper = document.createElement("div");
  wrapper.className = "video-wrapper";
  wrapper.innerHTML = `
    <div class="video-card">
      <video controls preload="metadata" playsinline>
        <source src="${video.src}" type="video/mp4">
      </video>
    </div>
    <div style="margin-top:10px;font-weight:bold;">${video.title}</div>
  `;
  container.appendChild(wrapper);
});

function confirmAge(){
  localStorage.setItem("ageConfirmed","true");
  document.getElementById("agePopup").style.display="none";
}

function denyAge(){
  document.getElementById("agePopup").style.display="none";
}

setTimeout(() => {
  if (!localStorage.getItem("ageConfirmed")) {
    document.getElementById("agePopup").style.display="flex";
  }
}, 35000);
</script>
