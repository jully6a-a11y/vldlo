<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Player</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
    }

    /* =========================
       LANDING PAGE
    ========================== */

    #page-landing {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .landing-box {
      width: 100%;
      max-width: 500px;
      background: #1c1c1c;
      border-radius: 14px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }

    .landing-box h1 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    .landing-box p {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .continue-btn {
      display: inline-block;
      border: none;
      background: #fff;
      color: #111;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .continue-btn:hover {
      opacity: .85;
    }

    /* =========================
       PLAYER PAGE
    ========================== */

    #page-player {
      display: none;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .video-wrapper {
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
      background: #000;
    }

    .video-info {
      padding: 15px 5px;
    }

    .video-info h2 {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .video-info p {
      color: #999;
      font-size: 14px;
    }

    /* =========================
       AD AREA
    ========================== */

    .ad-section {
      margin: 18px 0;
      width: 100%;
      text-align: center;
    }

    .ad-label {
      font-size: 11px;
      color: #777;
      margin-bottom: 5px;
    }

    #ad-container {
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }

    /* =========================
       BUTTONS
    ========================== */

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .buttons button,
    .buttons a {
      flex: 1;
      padding: 12px;
      border-radius: 7px;
      border: 0;
      text-decoration: none;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .next-btn {
      background: #fff;
      color: #111;
    }

    .telegram-btn {
      background: #229ed9;
      color: #fff;
    }

    @media (max-width: 600px) {
      #page-player {
        padding: 8px;
      }

      .landing-box {
        padding: 25px 18px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       LANDING PAGE
  ====================================================== -->

  <section id="page-landing">

    <div class="landing-box">

      <h1>Video Player</h1>

      <p>
        Klik tombol di bawah untuk melanjutkan ke halaman video.
      </p>

      <button
        class="continue-btn"
        id="continueBtn">
        Lanjut ke Video
      </button>

    </div>

  </section>


  <!-- =====================================================
       PLAYER PAGE
  ====================================================== -->

  <section id="page-player">

    <div class="container">

      <!-- VIDEO -->

      <div class="video-wrapper">

        <video
          id="mainVideo"
          controls
          playsinline
          preload="metadata">

          <source
            id="videoSource"
            src=""
            type="video/mp4">

          Browser Anda tidak mendukung video HTML5.

        </video>

      </div>


      <!-- INFO -->

      <div class="video-info">

        <h2 id="videoTitle">
          Video 1
        </h2>

        <p id="videoCounter">
          Video 1 dari 6
        </p>

      </div>


      <!-- =================================================
           IKLAN
      ================================================== -->

      <div class="ad-section">

        <div class="ad-label">
          Advertisement
        </div>

        <div id="ad-container"></div>

      </div>


      <!-- BUTTONS -->

      <div class="buttons">

        <button
          class="next-btn"
          id="nextBtn">
          Video Berikutnya
        </button>

        <a
          class="telegram-btn"
          href="https://t.me/+5_Xl2E1QYlM2Zjhl"
          target="_blank"
          rel="noopener noreferrer">
          Telegram
        </a>

      </div>

    </div>

  </section>


<script>
/* =========================================================
   VIDEO LIST
========================================================= */

const VIDEO_LIST = [

  {
    title: "Video 1",
    src: "https://cdn.aceimg.com/RVdNT7WCt.mp4"
  },

  {
    title: "Video 2",
    src: "https://cdn.aceimg.com/vk2CwUWuA.mp4"
  },

  {
    title: "Video 3",
    src: "https://cdn.aceimg.com/vnUdBmdPz.mp4"
  },

  {
    title: "Video 4",
    src: "https://cdn2.aceimg.com/FW1ZIEqq8.mp4"
  },

  {
    title: "Video 5",
    src: "https://cdn.aceimg.com/ZyV9shwz2.mp4"
  },

  {
    title: "Video 6",
    src: "https://cdn.aceimg.com/FKdYXm5Su.mp4"
  }

];


/* =========================================================
   ELEMENT
========================================================= */

const landingPage =
  document.getElementById("page-landing");

const playerPage =
  document.getElementById("page-player");

const continueBtn =
  document.getElementById("continueBtn");

const nextBtn =
  document.getElementById("nextBtn");

const video =
  document.getElementById("mainVideo");

const videoSource =
  document.getElementById("videoSource");

const videoTitle =
  document.getElementById("videoTitle");

const videoCounter =
  document.getElementById("videoCounter");

const adContainer =
  document.getElementById("ad-container");


/* =========================================================
   CURRENT VIDEO
========================================================= */

let currentVideoIndex = 0;


/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo(index) {

  if (index < 0) {
    index = 0;
  }

  if (index >= VIDEO_LIST.length) {
    index = 0;
  }

  currentVideoIndex = index;

  const videoData =
    VIDEO_LIST[currentVideoIndex];

  videoSource.src =
    videoData.src;

  videoTitle.textContent =
    videoData.title;

  videoCounter.textContent =
    "Video " +
    (currentVideoIndex + 1) +
    " dari " +
    VIDEO_LIST.length;

  video.load();

}


/* =========================================================
   NEXT VIDEO
========================================================= */

function nextVideo() {

  currentVideoIndex++;

  if (currentVideoIndex >= VIDEO_LIST.length) {
    currentVideoIndex = 0;
  }

  loadVideo(currentVideoIndex);

  video.play().catch(() => {});

}


/* =========================================================
   OPEN PLAYER
========================================================= */

function showPlayer() {

  landingPage.style.display = "none";

  playerPage.style.display = "block";

  loadVideo(currentVideoIndex);

}


/* =========================================================
   CONTINUE BUTTON
========================================================= */

continueBtn.addEventListener("click", function() {

  /*
   * Iklan hanya dimuat setelah user benar-benar
   * menekan tombol "Lanjut ke Video".
   */

  showPlayer();

  loadAdvertising();

});


/* =========================================================
   NEXT BUTTON
========================================================= */

nextBtn.addEventListener("click", function() {

  nextVideo();

});


/* =========================================================
   AUTO NEXT AFTER VIDEO END
========================================================= */

video.addEventListener("ended", function() {

  nextVideo();

});


/* =========================================================
   AD CONFIGURATION
========================================================= */

/*
   Pilih SATU provider aktif.
   
   "adsterra"
   atau
   "monetag"
*/

const ACTIVE_AD = "monetag";


/* =========================================================
   LOAD ADVERTISING
========================================================= */

let advertisingLoaded = false;

function loadAdvertising() {

  if (advertisingLoaded) {
    return;
  }

  advertisingLoaded = true;


  /* -------------------------------------------------------
     ADSTERRA
  -------------------------------------------------------- */

  if (ACTIVE_AD === "adsterra") {

    const script1 =
      document.createElement("script");

    script1.src =
      "https://crypotential.com/1c/26/08/1c2608f140f0035e99e6a3f46a738656.js";

    script1.async = true;

    adContainer.appendChild(script1);


    const script2 =
      document.createElement("script");

    script2.src =
      "https://crypotential.com/54/88/48/548848e09439c6e0d5af5e5aab5d16d4.js";

    script2.async = true;

    adContainer.appendChild(script2);

  }


  /* -------------------------------------------------------
     MONETAG
  -------------------------------------------------------- */

  if (ACTIVE_AD === "monetag") {

    const script1 =
      document.createElement("script");

    script1.src =
      "https://quge5.com/88/tag.min.js";

    script1.dataset.zone =
      "271434";

    script1.async = true;

    script1.dataset.cfasync =
      "false";

    adContainer.appendChild(script1);


    const script2 =
      document.createElement("script");

    script2.dataset.zone =
      "11570925";

    script2.src =
      "https://al5sm.com/tag.min.js";

    script2.async = true;

    adContainer.appendChild(script2);

  }

}


/* =========================================================
   INITIAL STATE
========================================================= */

landingPage.style.display = "flex";

playerPage.style.display = "none";


/* =========================================================
   URL PLAYER MODE
========================================================= */

/*
   Jika URL dibuka dengan:

   ?player=true

   maka langsung masuk player.
*/

const params =
  new URLSearchParams(
    window.location.search
  );

if (params.get("player") === "true") {

  showPlayer();

  loadAdvertising();

}


/* =========================================================
   PREVENT ACCIDENTAL PAGE RELOAD FROM VIDEO
========================================================= */

video.addEventListener(
  "error",
  function() {

    console.log(
      "Video gagal dimuat:",
      VIDEO_LIST[currentVideoIndex].src
    );

  }
);

</script>

</body>
</html>
