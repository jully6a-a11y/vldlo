<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#000000">
  <title>Main di Pantai & Alam - Kumpulan Video Potret</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      line-height: 1.4;
      min-height: 100vh;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 20px;
      background: #111;
      border-bottom: 1px solid #2a2a2a;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-weight: 800;
      font-size: 1.5rem;
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .main-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    .video-title {
      text-align: center;
      margin-bottom: 16px;
    }
    .video-title h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffb347, #ff6b6b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .video-title p {
      color: #aaa;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    /* Grid video */
    .videos-grid {
      display: flex;
      flex-direction: column;
      gap: 30px;
      margin-top: 20px;
    }

    .video-card-item {
      background: #0f0f0f;
      border-radius: 28px;
      overflow: hidden;
      padding: 16px;
      border: 1px solid #222;
    }

    .video-portrait {
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .video-container {
      position: relative;
      width: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      background: #000;
    }

    .video-caption {
      text-align: center;
      font-size: 0.85rem;
      color: #aaa;
      margin: 10px 0;
    }

    /* Iklan banner di antara video */
    .ad-banner {
      margin: 20px 0;
      text-align: center;
      background: #1a1a1a;
      border-radius: 20px;
      padding: 15px;
    }

    .ad-label {
      font-size: 0.7rem;
      color: #666;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @media (max-width: 550px) {
      .main-container { padding: 12px; }
      .video-title h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="navbar">
  <div class="logo">VidPlay</div>
</div>

<div class="main-container">
  <div class="video-title">
    <h1>🏖️ Main di Pantai & Alam 🌿</h1>
    <p>Nikmati keindahan alam | Kumpulan video potret</p>
  </div>

  <!-- DAFTAR VIDEO -->
  <div class="videos-grid" id="videosGrid"></div>
</div>

<!-- Iklan 1: Script pertama -->
<script src="https://pl29612091.effectivecpmnetwork.com/87/b8/2f/87b82fbdeaec82f8cdc287d94a4d7e3d.js"></script>

<!-- Iklan 2: Container invoke -->
<script async="async" data-cfasync="false" src="https://pl29612092.effectivecpmnetwork.com/93d359bd09428cd7b28219a7c715f1bb/invoke.js"></script>
<div id="container-93d359bd09428cd7b28219a7c715f1bb"></div>

<!-- Iklan 3: Script keempat -->
<script src="https://pl29612094.effectivecpmnetwork.com/bf/7e/44/bf7e445227ac8810fef97ef109b769f1.js"></script>

<!-- Iklan 4: AtOptions + invoke -->
<script>
  atOptions = {
    'key' : 'ee940f1f7e6e38b68bf1b06f8fb45eb9',
    'format' : 'iframe',
    'height' : 60,
    'width' : 468,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/ee940f1f7e6e38b68bf1b06f8fb45eb9/invoke.js"></script>

<script>
  // ================== DAFTAR VIDEO ==================
  const videoList = [
    { src: "https://res.cloudinary.com/dw7g393lj/video/upload/v1777744020/vidio3_h8psu0.mp4", title: "🏝️ Pantai Pasir Putih" },
    { src: "https://cdn2.slicedrive.com/0SnkAE8i1.mp4", title: "🌲 Hutan Tropis" },
    { src: "https://cdn2.slicedrive.com/48DFeQPD1.mp4", title: "🌊 Kebun Belakang Rumah" },
    { src: "https://cdn2.videy.co/wEkJbSvy1.mp4", title: "🎬 Judul Video Baru" },
    { src: "https://cdn2.slicedrive.com/T9MkqIWz1.mp4", title: "🎬 anak SMA" },
    { src: "https://cdn2.slicedrive.com/CLN2EI3H1.mp4", title: "🎬 tante ange" },
  ];
  
  // Render semua video ke halaman
  function renderVideos() {
    const grid = document.getElementById('videosGrid');
    if (!grid) return;
    
    grid.innerHTML = '';
    
    videoList.forEach((video, index) => {
      const videoId = `video_${index}`;
      const card = document.createElement('div');
      card.className = 'video-card-item';
      card.innerHTML = `
        <div class="video-portrait">
          <div class="video-container">
            <video id="${videoId}" controls playsinline poster="">
              <source src="${video.src}" type="video/mp4">
              Browser tidak mendukung video.
            </video>
          </div>
        </div>
        <div class="video-caption">
          ${video.title || '🎬 Video indah pantai & alam'}
        </div>
      `;
      grid.appendChild(card);
    });
  }
  
  // Panggil render saat halaman load
  renderVideos();
</script>

</body>
</html>
