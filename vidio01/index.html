<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#ff0000">
  <title>Main di Pantai & Alam - Kumpulan Video Potret</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f0 0%, #ffe0e0 100%);
      color: #1a1a2e;
      line-height: 1.4;
      min-height: 100vh;
    }

    /* Navbar Merah Putih */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 20px;
      background: linear-gradient(135deg, #ff0000, #cc0000);
      border-bottom: 3px solid #ffffff;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-weight: 800;
      font-size: 1.6rem;
      color: white;
    }

    .main-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    .video-title {
      text-align: center;
      margin-bottom: 16px;
    }
    .video-title h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff0000, #cc0000);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .video-title p {
      color: #cc0000;
      font-size: 0.9rem;
      margin-top: 5px;
      font-weight: 500;
    }

    /* Grid video */
    .videos-grid {
      display: flex;
      flex-direction: column;
      gap: 30px;
      margin-top: 20px;
    }

    .video-card-item {
      background: white;
      border-radius: 28px;
      overflow: hidden;
      padding: 16px;
      border: 1px solid #ffcccc;
      box-shadow: 0 8px 20px rgba(255,0,0,0.1);
    }

    .video-portrait {
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .video-container {
      position: relative;
      width: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      background: #000;
    }

    .video-caption {
      text-align: center;
      font-size: 0.85rem;
      color: #ff0000;
      margin: 10px 0;
      font-weight: 600;
    }

    @media (max-width: 550px) {
      .main-container { padding: 12px; }
      .video-title h1 { font-size: 1.5rem; }
    }
  </style>

  <!-- Histats.com  START  (aync)-->

  _Hasync.push(['Histats.start', '1,5030870,4,0,0,0,00010000']);

</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <div class="logo">🇮🇩 VidPlay Merah Putih 🇮🇩</div>
</div>

<div class="main-container">
  <div class="video-title">
    <h1>🏖️ selamat bersenang senang 🌿</h1>
    <p>Kumpulan video potret</p>
  </div>

  <!-- DAFTAR VIDEO -->
  <div class="videos-grid" id="videosGrid"></div>
</div>

<!-- Iklan quge5 -->
<script src="https://quge5.com/88/tag.min.js" data-zone="246803" async data-cfasync="false"></script>

<script>
/* ================== VIDEO RENDER ================== */
const videoList = [
  { src: "https://cdn2.slicedrive.com/0SnkAE8i1.mp4", title: "🌲 Hutan Tropis - Kalimantan" },
  { src: "https://cdn2.slicedrive.com/48DFeQPD1.mp4", title: "🌊 Pantai Selatan - Jogja" },
  { src: "https://cdn2.videy.co/wEkJbSvy1.mp4", title: "🎬 Sunset di Raja Ampat" },
  { src: "https://cdn2.slicedrive.com/T9MkqIWz1.mp4", title: "🎬 Liburan ke Pantai" },
  { src: "https://cdn2.slicedrive.com/CLN2EI3H1.mp4", title: "🎬 Pesona Alam Indonesia" },
];

// Render semua video ke halaman
function renderVideos() {
  const grid = document.getElementById('videosGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  
  videoList.forEach((video, index) => {
    const videoId = `video_${index}`;
    const card = document.createElement('div');
    card.className = 'video-card-item';
    card.innerHTML = `
      <div class="video-portrait">
        <div class="video-container">
          <video id="${videoId}" controls playsinline poster="">
            <source src="${video.src}" type="video/mp4">
            Browser tidak mendukung video.
          </video>
        </div>
      </div>
      <div class="video-caption">
        📹 ${video.title || '🎬 Video indah pantai & alam'}
      </div>
    `;
    grid.appendChild(card);
  });
}

// Panggil render saat halaman load
renderVideos();
</script>

</body>
</html>
