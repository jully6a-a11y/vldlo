<script>

// ==================== FUNGSI YANG SUDAH ADA (TIDAK DIUBAH) ====================
function fakeDownload() {
  // REDIRECT KE DOMAIN SENDIRI DULU
  window.open("https://vldlo.my.id/redirect/","_blank");
}

const adLink = "https://www.profitablecpmratenetwork.com/u666fja6?key=2e5b8f8db6d24f5655ac4136832b98a4";

// ==================== LOGIKA POPUP USIA DAN POPUP IKLAN BARU ====================
const video = document.getElementById('mainVideo');
const agePopup = document.getElementById('agePopup');
const adPopup = document.getElementById('adPopup');
const adIframe = document.getElementById('adIframe');
const closeAdBtn = document.getElementById('closeAdBtn');
const countdownMsg = document.getElementById('countdownMsg');

let ageConfirmedThisSession = false;  // Apakah sudah konfirmasi usia di sesi ini
let adShownThisSession = false;       // Apakah popup iklan sudah ditampilkan di sesi ini
let videoTimeCheckInterval = null;    // Interval pengecekan waktu video
let isAgePopupTriggered = false;      // Mencegah popup usia muncul berkali-kali

// URL redirect agresif (menggunakan yang sudah ada di geo redirect)
const aggressiveAdUrl = "https://www.profitablecpmratenetwork.com/e60uraaz?key=00a8daf307455fd2003c7555c0a41b6f";

// Fungsi pause video
function pauseVideo() {
  if (video && !video.paused) {
    video.pause();
  }
}

// Fungsi play video
function playVideo() {
  if (video && ageConfirmedThisSession) {
    video.play().catch(e => console.log("Autoplay dicegah browser"));
  }
}

// Fungsi redirect ke iklan agresif
function redirectToAggressiveAd() {
  window.open(aggressiveAdUrl, "_blank");
}

// Fungsi menampilkan popup iklan dengan timer 5 detik
function showAdPopupWithTimer() {
  if (adShownThisSession) return;
  adShownThisSession = true;
  
  // Isi iframe dengan URL iklan yang sudah ada
  adIframe.src = adLink;
  
  // Tampilkan popup
  adPopup.style.display = "block";
  
  // Sembunyikan tombol close
  closeAdBtn.style.display = "none";
  
  let secondsLeft = 5;
  countdownMsg.innerText = `Tutup tersedia dalam ${secondsLeft} detik`;
  
  const timer = setInterval(() => {
    secondsLeft--;
    if (secondsLeft > 0) {
      countdownMsg.innerText = `Tutup tersedia dalam ${secondsLeft} detik`;
    } else {
      clearInterval(timer);
      countdownMsg.innerText = "";
      closeAdBtn.style.display = "block";
    }
  }, 1000);
}

// Event tombol "Lanjut" (sudah 18+)
document.getElementById('ageConfirmBtn').onclick = () => {
  agePopup.style.display = "none";
  ageConfirmedThisSession = true;
  playVideo();
  
  // Tampilkan popup iklan setelah lanjut (hanya sekali per sesi)
  if (!adShownThisSession) {
    showAdPopupWithTimer();
  }
};

// Event tombol "Tidak"
document.getElementById('ageDenyBtn').onclick = () => {
  agePopup.style.display = "none";
  pauseVideo();
  redirectToAggressiveAd(); // Redirect ke iklan agresif
};

// Fungsi untuk mengecek waktu video setiap detik
function startVideoWatcher() {
  if (videoTimeCheckInterval) clearInterval(videoTimeCheckInterval);
  
  videoTimeCheckInterval = setInterval(() => {
    // Jika usia belum dikonfirmasi, video belum mencapai 20 detik, dan popup belum muncul
    if (!ageConfirmedThisSession && !isAgePopupTriggered && video && video.currentTime >= 20) {
      isAgePopupTriggered = true;
      clearInterval(videoTimeCheckInterval); // Hentikan pengecekan
      pauseVideo();                         // Pause video
      agePopup.style.display = "flex";      // Tampilkan popup usia
    }
  }, 500); // Cek setiap 0.5 detik untuk respons lebih cepat
}

// Tutup popup iklan (setelah tombol X muncul)
closeAdBtn.onclick = () => {
  adPopup.style.display = "none";
  adIframe.src = "about:blank";
};

// Reset state saat halaman dimuat ulang (tanpa localStorage)
function resetSessionState() {
  ageConfirmedThisSession = false;
  adShownThisSession = false;
  isAgePopupTriggered = false;
  agePopup.style.display = "none";
  adPopup.style.display = "none";
  
  // Hentikan interval lama jika ada
  if (videoTimeCheckInterval) {
    clearInterval(videoTimeCheckInterval);
    videoTimeCheckInterval = null;
  }
}

// Inisialisasi saat video siap
function initVideoWatcher() {
  resetSessionState();
  
  // Jika video sudah memiliki duration, langsung mulai watcher
  if (video && video.readyState >= 1) {
    startVideoWatcher();
  } else {
    // Tunggu video siap
    video.addEventListener('loadedmetadata', function onLoaded() {
      startVideoWatcher();
      video.removeEventListener('loadedmetadata', onLoaded);
    });
  }
}

// Jalankan inisialisasi saat halaman load
window.addEventListener('load', () => {
  initVideoWatcher();
  
  // Jika pengguna me-refresh halaman saat video sedang diputar, reset ulang
  if (video) {
    video.currentTime = 0; // Opsional: reset waktu video ke awal setiap refresh
  }
});
