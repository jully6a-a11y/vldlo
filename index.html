  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #efd8a5;
      --soft: #ffe6b5;
      --sidebar: #f7e6bd;
      --text: #080808;
      --blue: #4b8fd8;
      --shadow: rgba(0,0,0,.18);
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    /* SIDEBAR KIRI */
    .sidebar {
      width: 48px;
      min-height: 100vh;
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 6px;
      gap: 18px;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 50;
    }

    .side-logo {
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      transform: skew(-8deg);
    }

    .side-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-top: 10px;
    }

    .side-bottom {
      margin-top: auto;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: #000;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .icon-btn svg {
      width: 30px;
      height: 30px;
      stroke: #000;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-btn .fill {
      fill: #000;
      stroke: none;
    }

    /* AREA UTAMA */
    .page {
      margin-left: 48px;
      width: calc(100% - 48px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR ATAS */
    .navbar {
      height: 38px;
      background: #ffe2aa;
      display: grid;
      grid-template-columns: 120px 1fr 150px;
      align-items: center;
      padding: 0 12px 0 16px;
      gap: 14px;
      border-bottom-right-radius: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      color: var(--blue);
      letter-spacing: -1px;
      font-family: Georgia, serif;
    }

    .search-wrap {
      display: flex;
      justify-content: center;
    }

    .search-box {
      width: min(100%, 330px);
      height: 26px;
      background: #fff;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      box-shadow: inset 0 0 0 1px #eee, 0 2px 6px rgba(0,0,0,.12);
    }

    .search-box svg {
      width: 17px;
      height: 17px;
      stroke: #777;
      stroke-width: 2.5;
      fill: none;
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 12px;
      background: transparent;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .pill-btn {
      border: none;
      background: #fff;
      color: #111;
      height: 24px;
      min-width: 58px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(0,0,0,.14);
      cursor: pointer;
    }

    /* KONTEN VIDEO UTAMA */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 12px 0;
    }

    .main-card {
      width: min(100%, 540px);
      background: var(--soft);
      border-radius: 12px;
      padding: 4px 38px 14px;
      text-align: center;
    }

    .video-title h1 {
      font-size: clamp(28px, 5vw, 46px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -2px;
      color: #050505;
      text-transform: lowercase;
      margin-bottom: 8px;
    }

    .video-frame {
      width: 100%;
      background: #181818;
      border: 8px solid #151515;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 0 rgba(0,0,0,.45);
      position: relative;
    }

    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      object-fit: contain;
      background: #000;
    }

    /* BAGIAN VIDEO KECIL */
    .more-section {
      width: 100%;
      margin-top: 10px;
      background: rgba(255, 238, 198, .55);
      border-top-left-radius: 18px;
      padding: 10px 18px 12px 28px;
      position: relative;
    }

    .more-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      padding-right: 2px;
    }

    .more-title {
      font-size: 13px;
      font-weight: 900;
      color: #000;
      margin-left: 2px;
    }

    /* BUTTON GRID / LIST */
    .view-toggle {
      width: 34px;
      height: 34px;
      border: 3px solid #111;
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 4px;
      z-index: 10;
      flex-shrink: 0;
    }

    .icon-grid,
    .icon-list {
      width: 22px;
      height: 22px;
      display: none;
    }

    .icon-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
    }

    .icon-grid i {
      border: 2px solid #111;
      border-radius: 2px;
    }

    .icon-list {
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .icon-list i {
      width: 18px;
      height: 3px;
      background: #111;
      border-radius: 99px;
    }

    .view-toggle .icon-grid {
      display: grid;
    }

    .view-toggle.list-active .icon-grid {
      display: none;
    }

    .view-toggle.list-active .icon-list {
      display: flex;
    }

    .thumb-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 28px;
      align-items: end;
    }

    .thumb-card {
      cursor: pointer;
      text-align: center;
      border: none;
      background: transparent;
      color: #000;
    }

    .thumb-name {
      font-size: 6px;
      font-weight: 800;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thumb-video {
      background: #050505;
      border: 3px solid #151515;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 2px 0 rgba(0,0,0,.3);
      transition: transform .18s ease;
    }

    .thumb-card:hover .thumb-video {
      transform: translateY(-3px);
    }

    .thumb-video video {
      aspect-ratio: 16 / 9;
      object-fit: cover;
      pointer-events: none;
    }

    /* MODE LIST */
    .thumb-row.list-mode {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 520px;
    }

    .thumb-row.list-mode .thumb-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      background: rgba(255,255,255,.18);
      border-radius: 10px;
      padding: 8px;
    }

    .thumb-row.list-mode .thumb-name {
      order: 2;
      font-size: 12px;
      margin-bottom: 0;
      white-space: normal;
      overflow: visible;
      text-overflow: unset;
    }

    .thumb-row.list-mode .thumb-video {
      order: 1;
      width: 100px;
      min-width: 100px;
    }

    .ad-area {
      display: none;
    }

    @media (max-width: 760px) {
      .navbar {
        grid-template-columns: 90px 1fr 118px;
        gap: 8px;
        padding-left: 12px;
      }

      .logo {
        font-size: 20px;
      }

      .pill-btn {
        min-width: 48px;
        padding: 0 8px;
        font-size: 9px;
      }

      .main-card {
        padding: 4px 18px 12px;
      }

      .thumb-row {
        gap: 16px;
      }

      .more-section {
        padding-left: 18px;
      }
    }

    @media (max-width: 560px) {
      .sidebar {
        width: 42px;
      }

      .page {
        margin-left: 42px;
        width: calc(100% - 42px);
      }

      .navbar {
        height: auto;
        min-height: 44px;
        grid-template-columns: 1fr;
        padding: 8px 10px;
      }

      .logo {
        text-align: center;
      }

      .top-actions {
        justify-content: center;
      }

      .search-box {
        width: 100%;
      }

      .thumb-row {
        display: flex;
        overflow-x: auto;
        gap: 16px;
        padding-bottom: 8px;
      }

      .thumb-card {
        min-width: 90px;
      }

      .thumb-row.list-mode {
        overflow-x: visible;
      }

      .thumb-row.list-mode .thumb-card {
        min-width: 0;
      }

      .video-title h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<script>
  const redirectLink = "https://reactahead.com/h27gc261ka?key=f750eac45c499fbd74e10da61d1170b8";

  const videoList = [
    { src: "https://data.vividey.co/backup/20260607/45d32c2957d5497abae745fd778289cb.mp4", title: "Momen Santai di Rumah" },
    { src: "https://data.vividey.co/backup/20260615/f3f434aa4e2d4621b442ec6f864b1bc5.mp4", title: "Vlog Jalan Sore" },

    { src: "https://data.vividey.co/backup/20260614/45161f9d5963483e9656b4bceb0b5d8c.mp4", title: "Kegiatan Pagi yang Tenang" },
    { src: "https://cdn2.slicedrive.com/0SnkAE8i1.mp4", title: "Suasana Alam Terbuka" },
    { src: "https://data.vividey.co/backup/20260614/0d7f4069d33248689dadabdb19f31257.mp4", title: "Perjalanan Kecil Hari Ini" },
    { src: "https://cdn2.videy.co/wEkJbSvy1.mp4", title: "Momen Lucu Tak Terduga" },
    { src: "https://cdn2.slicedrive.com/T9MkqIWz1.mp4", title: "Santai Menikmati Waktu" },
    { src: "https://data.vividey.co/backup/20260614/dff632eda5404d1aac64279cc88bc3e7.mp4", title: "Kisah Pendek Sore Hari" },
    { src: "https://cdn2.slicedrive.com/CLN2EI3H1.mp4", title: "Potret Aktivitas Harian" },

    { src: "https://data.vividey.co/backup/20260614/45161f9d5963483e9656b4bceb0b5d8c.mp4", title: "Suasana Hangat Bersama" },
    { src: "https://data.vividey.co/backup/20260615/28b70bdf961d426581b02c39eb2f617e.mp4", title: "Jalan-Jalan Ringan" },
    { src: "https://cdn2.slicedrive.com/48DFeQPD1.mp4", title: "Cerita di Balik Kamera" },
    { src: "https://data.vividey.co/backup/20260615/7b35c95b2dff49d29c74a2e0e291522b.mp4", title: "Video Pilihan Hari Ini" },
    { src: "https://cdn2.slicedrive.com/T9MkqIWz1.mp4", title: "Momen Tenang di Luar Rumah" },

    { src: "https://data.vividey.co/backup/20260614/45161f9d5963483e9656b4bceb0b5d8c.mp4", title: "Kumpulan Momen Harian" },
    { src: "https://cdn2.slicedrive.com/0SnkAE8i1.mp4", title: "Santai Setelah Aktivitas" },
    { src: "https://cdn2.slicedrive.com/48DFeQPD1.mp4", title: "Cuplikan Random Seru" },
    { src: "https://cdn2.videy.co/wEkJbSvy1.mp4", title: "Hari Biasa yang Menarik" },
    { src: "https://cdn2.slicedrive.com/T9MkqIWz1.mp4", title: "Vlog Singkat Terbaru" },
    { src: "https://cdn2.slicedrive.com/CLN2EI3H1.mp4", title: "Momen Pilihan Spesial" },
    { src: "https://data.vividey.co/backup/20260615/43dfd562372e4cc98aa592a6ceba2cee.mp4", title: "Rekaman Santai Hari Ini" }
  ];

  const mainVideo = document.getElementById('mainVideo');
  const mainSource = document.getElementById('mainSource');
  const mainTitle = document.getElementById('mainTitle');
  const thumbRow = document.getElementById('thumbRow');
  const viewToggle = document.getElementById('viewToggle');

  let playUnlocked = false;

  function openRedirect() {
    window.open(redirectLink, '_blank');
  }

  function loadMainVideo(index) {
    const item = videoList[index];

    playUnlocked = false;
    mainTitle.textContent = item.title || 'judul vidio nya';
    mainSource.src = item.src;
    mainVideo.load();
  }

  function renderThumbs() {
    thumbRow.innerHTML = '';

    videoList.forEach((item, index) => {
      const button = document.createElement('button');
      button.className = 'thumb-card';
      button.type = 'button';

      button.innerHTML = `
        <div class="thumb-name">${item.title || 'judul vidio'}</div>
        <div class="thumb-video">
          <video muted preload="metadata" playsinline>
            <source src="${item.src}" type="video/mp4">
          </video>
        </div>
      `;

      button.addEventListener('click', () => {
        loadMainVideo(index);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      thumbRow.appendChild(button);
    });
  }

  /* Button grid/list tetap normal */
  viewToggle.addEventListener('click', () => {
    const isList = thumbRow.classList.toggle('list-mode');

    viewToggle.classList.toggle('list-active', isList);
    viewToggle.setAttribute('aria-pressed', isList ? 'true' : 'false');
  });

  /* Saat play pertama kali, buka link dulu, lalu video lanjut play */
  mainVideo.addEventListener('play', () => {
    if (!playUnlocked) {
      playUnlocked = true;
      mainVideo.pause();
      openRedirect();

      setTimeout(() => {
        mainVideo.play().catch(() => {});
      }, 600);
    }
  });

  /* Button yang masuk ke link:
     home, profile, download, upload/tambah, exit/power */
  document.querySelectorAll('.redirect-btn').forEach((button) => {
    button.addEventListener('click', (event) => {
      event.preventDefault();
      openRedirect();
    });
  });

  renderThumbs();
  loadMainVideo(0);
</script>
