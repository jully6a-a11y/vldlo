  <iframe id="adIframe" src="about:blank"></iframe>

<script>
  // ================== KONSTANTA IKLAN ==================
  const adLink = "https://www.profitablecpmratenetwork.com/u666fja6?key=2e5b8f8db6d24f5655ac4136832b98a4";
  const geoLinkID = "https://www.profitablecpmratenetwork.com/e60uraaz?key=00a8daf307455fd2003c7555c0a41b6f";
  const geoLinkAll = "https://www.profitablecpmratenetwork.com/e60uraaz?key=00a8daf307455fd2003c7555c0a41b6f";

  // Elemen video utama
  const video = document.getElementById('mainVideo');
  let agePopupShown = false;       // apakah popup sedang tampil
  let waitingForAgeResponse = false;
  let videoCurrentInterval = null;
  let isVideoPausedByPopup = false;

  // Fungsi untuk menampilkan popup umur (tanpa jeda langsung)
  function showAgePopup() {
    if (waitingForAgeResponse) return; // sudah ada popup
    if (document.getElementById('agePopup').style.display === 'flex') return;
    // pause video jika sedang diputar
    if (video && !video.paused) {
      video.pause();
      isVideoPausedByPopup = true;
    }
    waitingForAgeResponse = true;
    document.getElementById('agePopup').style.display = 'flex';
  }

  // Menutup popup umur
  function hideAgePopup() {
    document.getElementById('agePopup').style.display = 'none';
    waitingForAgeResponse = false;
    if (isVideoPausedByPopup && video && video.paused) {
      // Jangan lanjutkan dulu, nanti setelah iklan selesai (jika jawab ya) 
      // tapi untuk kasus jawab tidak langsung redirect
    }
    isVideoPausedByPopup = false;
  }

  // Fungsi membuka iklan (redirect)
  function redirectToAd(link) {
    window.open(link, "_blank");
  }

  // TAMPILKAN INTERSTITIAL IKLAN sebelum melanjutkan video (jawab YA)
  function showInterstitialAd(callbackAfterClose) {
    let interstitialDiv = document.getElementById('adInterstitial');
    let iframeInter = document.getElementById('interstitialIframe');
    if (iframeInter) iframeInter.src = adLink;  // muat iklan di iframe
    
    interstitialDiv.style.display = 'flex';
    
    // Tombol buka iklan di tab baru
    const openBtn = document.getElementById('openInterstitialAdBtn');
    const closeBtn = document.getElementById('closeInterstitialBtn');
    
    const cleanup = () => {
      interstitialDiv.style.display = 'none';
      if (iframeInter) iframeInter.src = 'about:blank';
      openBtn.removeEventListener('click', openHandler);
      closeBtn.removeEventListener('click', closeHandler);
      if (callbackAfterClose) callbackAfterClose();
    };
    
    const openHandler = () => {
      window.open(adLink, '_blank');
      // setelah buka iklan, tetap bisa langsung lanjut
      cleanup();
    };
    
    const closeHandler = () => {
      cleanup();
    };
    
    openBtn.addEventListener('click', openHandler);
    closeBtn.addEventListener('click', closeHandler);
    // sekali aja
    openBtn.onclick = openHandler;
    closeBtn.onclick = closeHandler;
  }
  
  // Respon ketika user klik YA
  function onAgeYes() {
    hideAgePopup();
    // Tampilkan iklan dulu sekali, setelah itu video bisa lanjut
    showInterstitialAd(() => {
      // Setelah iklan ditutup / diklik, lanjutkan video
      if (video && video.paused && !video.ended) {
        video.play().catch(e => console.log("autoplay error", e));
      }
      // reset flag
      isVideoPausedByPopup = false;
    });
  }
  
  // Respon ketika user klik TIDAK -> langsung ke iklan tanpa bisa kembali ke video
  function onAgeNo() {
    hideAgePopup();
    // redirect ke iklan (buka tab baru)
    window.open(adLink, '_blank');
    // video tetap pause, tidak dilanjutkan sampai user reload? sesuai keinginan "masuk terus ke iklan"
    if (video) video.pause();
    // Tampilkan peringatan opsional? tidak perlu, langsung kena iklan.
    // Biarkan video tidak lanjut sampai user refresh/klik play manual.
    // Tapi user masih bisa memutar manual setelahnya, tapi itu wajar.
  }
  
  // Event listener untuk tombol popup
  document.getElementById('ageYesBtn').addEventListener('click', onAgeYes);
  document.getElementById('ageNoBtn').addEventListener('click', onAgeNo);
  
  // Fungsi untuk memeriksa setiap 30 detik waktu pemutaran video (currentTime)
  let lastPopupTime = 0;
  function checkVideoTimeForAgePopup() {
    if (!video) return;
    if (waitingForAgeResponse) return; // popup sudah aktif, jangan double
    if (video.paused || video.ended) return;
    
    const currentTime = video.currentTime;
    // Tiap 30 detik (batas: setiap detik ke 30, 60, 90 ...)
    // Gunakan threshold: jika currentTime >= lastPopupTime + 30
    if (currentTime >= lastPopupTime + 30) {
      lastPopupTime = Math.floor(currentTime / 30) * 30; // update terdekat
      showAgePopup();
    }
  }
  
  // Mulai interval pengecekan waktu video
  function startAgeInterval() {
    if (videoCurrentInterval) clearInterval(videoCurrentInterval);
    videoCurrentInterval = setInterval(() => {
      checkVideoTimeForAgePopup();
    }, 500); // cek tiap 0.5 detik
  }
  
  // Ketika video dimainkan atau dipause, tetap jalankan interval tapi hanya cek saat play
  video.addEventListener('play', () => {
    startAgeInterval();
    // reset lastPopupTime berdasarkan current time saat play untuk menghindari spam langsung
    if (video.currentTime > 0) {
      let segment = Math.floor(video.currentTime / 30);
      lastPopupTime = segment * 30;
    } else {
      lastPopupTime = 0;
    }
  });
  
  video.addEventListener('pause', () => {
    // interval tetap berjalan tapi tidak akan trigger karena kondisi video.paused di checkVideoTimeForAgePopup
  });
  
  video.addEventListener('seeked', () => {
    // after seek, sync lastPopupTime
    let seg = Math.floor(video.currentTime / 30);
    lastPopupTime = seg * 30;
  });
  
  // Inisialisasi jika video langsung autoplay? tidak, user harus play
  startAgeInterval(); // interval berjalan, namun kondisi video.paused akan menghalangi
  
  // ========== FUNGSI DOWNLOAD ==========
  function fakeDownload() {
    window.open("https://vldlo.my.id/redirect/", "_blank");
  }
  
  // ========== Iklan Popup Periodik (30-40 detik sekali, tidak mengganggu video) ==========
  function showPeriodicAd() {
    let popup = document.getElementById("adPopup");
    let iframe = document.getElementById("adIframe");
    if (iframe) iframe.src = adLink;
    if (popup) popup.style.display = "block";
    setTimeout(() => {
      if (popup) popup.style.display = "none";
    }, 12000);
  }
  
  function closeAd() {
    document.getElementById("adPopup").style.display = "none";
  }
  
  function randomAdLoop() {
    let delay = Math.floor(Math.random() * (40000 - 30000)) + 30000;
    setTimeout(() => {
      showPeriodicAd();
      setTimeout(randomAdLoop, 500);
    }, delay);
  }
  randomAdLoop();
  
  // Tombol buka iklan di popup left
  document.addEventListener("DOMContentLoaded", function() {
    let openLinkBtn = document.getElementById("openAdLinkBtn");
    if (openLinkBtn) {
      openLinkBtn.addEventListener("click", function(e) {
        e.preventDefault();
        window.open(adLink, "_blank");
      });
    }
  });
  
  // ========== GEO REDIRECT (tetap) ==========
  function geoip(g) {
    setTimeout(function() {
      if (g && g.country === "ID") {
        window.open(geoLinkID, "_blank");
      } else {
        window.open(geoLinkAll, "_blank");
      }
    }, 3000);
  }
  
  // Pastikan agePopup tidak muncul sebelum video diputar pertama kali (tapi sesuai keinginan 30 detik video jalan)
  // ========== SEMUA SCRIPT IKLAN ASLI TIDAK DIHAPUS ==========
</script>
